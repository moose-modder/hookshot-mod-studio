[package]
name = "havok-cloth"
description = "Havok cloth simulation as Sekiro and Elden Ring run it, from the cloth data havok-formats reads"
keywords = ["havok", "cloth", "gamedev", "modding", "simulation"]
categories = ["simulation", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/havok-cloth"
version = "0.3.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/havok-cloth"
publish = false
exclude = ["docs/"]
# Vendored from https://github.com/Kalmarv/havok-cloth (THIRD_PARTY.md), with havok-formats from the vendored copy
# beside it (0.10.0; upstream pins a 0.9 commit).

[dependencies]
havok-formats = { path = "../havok-formats", version = "0.10.0" }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[dev-dependencies]
primase-testdata = "0.1.8"
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "deny"
unused_must_use = "deny"

[lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
# file and process access is denied in lib.rs; tests and examples read game files
disallowed_methods = "allow"
disallowed_types = "allow"
