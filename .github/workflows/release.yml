name: Release

# A release for a version tag: push `v0.1.0` (matching the version in Cargo.toml, app/package.json and
# app/src-tauri/tauri.conf.json) and this builds the Windows release with app/scripts/make_dist.py and attaches it,
# with the source, to the GitHub release of that tag. Nothing from the game is needed or included.
#
# Run it by hand (Actions > Release > Run workflow) for a test build: the zip is kept as the run's artifact and no
# release is made.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          python - <<'EOF'
          import json, os, re, sys
          cargo = re.search(r'^version = "(.*)"', open("Cargo.toml").read(), re.M).group(1)
          npm = json.load(open("app/package.json"))["version"]
          tauri = json.load(open("app/src-tauri/tauri.conf.json"))["version"]
          if len({cargo, npm, tauri}) != 1:
              sys.exit(f"versions differ: Cargo.toml {cargo}, app/package.json {npm}, tauri.conf.json {tauri}")
          ref = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_REF_TYPE"] == "tag" and ref != f"v{cargo}":
              sys.exit(f"the tag {ref} doesn't match the version {cargo}: tag v{cargo}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"VERSION={cargo}\n")
          print(f"version {cargo}")
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # rustup installs the toolchain pinned in rust-toolchain.toml; make_dist.py builds in target/dist
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/dist"

      - run: npm ci
        working-directory: app

      - run: python app/scripts/make_dist.py --zip

      - uses: actions/upload-artifact@v4
        with:
          name: HookshotModStudio-${{ env.VERSION }}-windows
          path: dist/HookshotModStudio-${{ env.VERSION }}-windows.zip

      - name: GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("dist/HookshotModStudio-$VERSION-windows.zip" "dist/hookshot-mod-studio-source.zip")
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Hookshot Mod Studio $VERSION" --generate-notes
          fi
